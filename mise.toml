min_version = "2026.6.6"

[tools]
prek = "0.5.11"
rumdl = "0.3.5"
tombi = "1.11.3"
"github:owenlamont/ryl" = "0.30.0"
opentofu = "1.12.6"
tflint = "0.65.0"
actionlint = "1.7.12"
rust = { version = "1.100.0", profile = "minimal", components = "clippy,rustfmt", targets = "wasm32-wasip2" }
bun = "1.4.5"

[task_config]
includes = [
  ".mise/prek.toml",
  ".mise/tofu.toml",
  ".mise/rust.toml",
  ".mise/httpyac.toml",
]

[vars]
tofu_dir = "{{ config_root }}/terraform/"
