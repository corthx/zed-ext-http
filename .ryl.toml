[lint.rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
comments = "enable"
comments-indentation = "enable"
document-start = "enable"
empty-lines = "enable"
hyphens = "enable"
indentation = "enable"
key-duplicates = "enable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
trailing-spaces = "enable"
truthy = "enable"
line-length = { max = 120 }
