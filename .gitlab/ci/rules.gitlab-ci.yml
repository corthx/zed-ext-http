      changes: *tofu-pipeline-schedule-renovate-patterns
    - <<: *if-merge-request-label-tofu-plan
    - <<: *if-merge-request-label-tofu-apply
    - <<: *if-default-branch
      changes: *tofu-pipeline-schedule-renovate-patterns
    - <<: *if-manual-run
    - <<: *if-destroy-infra

.tofu:rules:apply:pipeline-schedule:renovate:
  rules:
    - <<: *if-merge-request-label-tofu-apply
      when: manual
    - <<: *if-default-branch
      changes: *tofu-pipeline-schedule-renovate-patterns
      when: manual
    - <<: *if-manual-run
      when: manual

.tofu:rules:plan:terraform-provider-bot:
  rules:
    - <<: *if-merge-request
