---

renovate:
  stage: maintenance
  extends:
    - .renovate-image
    - .default-retry
    - .not-interruptible
    - .no-checkout
  needs: []
  dependencies: []
  rules:
    - !reference [".renovate:rules", rules]
  cache:
    - !reference [".renovate-cache", cache]
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    # Commits must use the bot's GitLab-assigned email, or GitLab doesn't
    # attribute them to it.
    RENOVATE_GIT_AUTHOR: "Renovate Bot <$RENOVATE_GIT_AUTHOR_EMAIL>"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
  script:
    - renovate
